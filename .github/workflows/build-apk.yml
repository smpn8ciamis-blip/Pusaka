name: Build APK

# Jalankan manual: tab Actions → "Build APK" → Run workflow. Hasil: file di Releases ("apk-terbaru") dan di Artifacts.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Siapkan keystore penanda tangan
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi (lihat petunjuk di PR)."; exit 1
          fi
          echo "$KS_B64" | base64 -d > twa/app/release.jks

      - name: Build APK rilis
        working-directory: twa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: pusaka
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Ganti nama & tampilkan sidik jari
        run: |
          cp twa/app/build/outputs/apk/release/app-release.apk Pusaka.apk
          keytool -printcert -jarfile Pusaka.apk | grep -E "SHA256|Owner" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Pusaka-apk
          path: Pusaka.apk

      - name: Publikasikan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-terbaru --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-terbaru Pusaka.apk --title "Pusaka APK (build ${{ github.run_number }})" --notes "APK Pusaka versi 1.0.${{ github.run_number }}"
