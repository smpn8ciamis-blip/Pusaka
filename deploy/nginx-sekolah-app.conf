# ====================================================
# REDIRECT HTTP -> HTTPS
# ====================================================
server {
    listen 80;
    server_name pusaka.smpn8ciamis.sch.id www.pusaka.smpn8ciamis.sch.id
                api-pusaka.smpn8ciamis.sch.id
                smpn8ciamis.sch.id www.smpn8ciamis.sch.id;
    return 301 https://$host$request_uri;
}
