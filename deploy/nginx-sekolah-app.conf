# ====================================================
# KONFIGURASI NGINX — SEKOLAH APP (SMPN 8 CIAMIS)
# File: /etc/nginx/sites-available/sekolah-app
# ====================================================

# ====================================================
# OPTIMASI BUFFER
# ====================================================
large_client_header_buffers 4 32k;
client_header_buffer_size 8k;

# ====================================================
# CORS ALLOWED ORIGINS
# Map ini menentukan origin mana yang boleh mengakses API.
# ====================================================
map $http_origin $cors_allowed_origin {
    default "";
    "~^https://(pusaka\.smpn8ciamis\.sch\.id|www\.pusaka\.smpn8ciamis\.sch\.id|smpn8ciamis\.sch\.id|www\.smpn8ciamis\.sch\.id)$" $http_origin;
}

# ====================================================
# CRAWLER PRATINJAU TAUTAN (WhatsApp, Facebook, Telegram, dll.)
# Hanya crawler pratinjau; sengaja BUKAN pola umum "bot" agar Googlebot dkk. tetap
# memakai halaman SPA biasa.
# ====================================================
map $http_user_agent $og_crawler {
    default 0;
    "~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview)" 1;
}

# ====================================================
# SERVER API — api-pusaka.smpn8ciamis.sch.id
# ====================================================
server {
    listen 443 ssl http2;
    server_name api-pusaka.smpn8ciamis.sch.id;

    ssl_certificate /etc/letsencrypt/live/api-pusaka.smpn8ciamis.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-pusaka.smpn8ciamis.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ============================================================
    # ★★★ HANDLE SEMUA ENDPOINT SUPABASE ★★★
    # Menangkap: /rest/v1/, /auth/v1/, /storage/v1/,
    # /realtime/v1/, /functions/v1/
    # ============================================================
    location ~ ^/(rest|auth|storage|realtime|functions)/v1/ {
        # ---- Preflight OPTIONS ----
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allowed_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, apikey, x-client-info, x-supabase-api-version, x-requested-with, accept, origin, prefer, range, if-none-match, if-modified-since" always;
            add_header Access-Control-Max-Age "3600" always;
            add_header Vary "Origin" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # ---- Hapus header CORS dari Kong ----
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # ---- Tambahkan header CORS kita ----
        add_header Access-Control-Allow-Origin $cors_allowed_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, apikey, x-client-info, x-supabase-api-version, x-requested-with, accept, origin, prefer, range, if-none-match, if-modified-since" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, X-Total-Count, Content-Type" always;
        add_header Vary "Origin" always;

        # ---- Teruskan URI mentah ke Kong ----
        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Original-URI $request_uri;

        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ============================================================
    # Fallback untuk request lain (non-API)
    # ============================================================
    location / {
        add_header Access-Control-Allow-Origin $cors_allowed_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;

        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}

# ====================================================
# SERVER FRONTEND PUSAKA
# ====================================================
server {
    listen 443 ssl http2;
    server_name pusaka.smpn8ciamis.sch.id www.pusaka.smpn8ciamis.sch.id;

    root /srv/app/app/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/pusaka.smpn8ciamis.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pusaka.smpn8ciamis.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ------------------------------------------------------------------
    # Content Security Policy
    # ------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.hcaptcha.com https://hcaptcha.com https://challenges.cloudflare.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://*.instagram.com https://www.instagram.com https://platform.instagram.com https://static.cdninstagram.com; style-src 'self' 'unsafe-inline' https://*.hcaptcha.com https://fonts.googleapis.com https://*.instagram.com https://www.instagram.com; img-src 'self' data: blob: https: https://*.instagram.com https://www.instagram.com https://scontent.cdninstagram.com https://instagram.f*-*.*; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' blob: https://*.hcaptcha.com https://hcaptcha.com https://challenges.cloudflare.com https://www.google.com https://www.recaptcha.net https://recaptcha.google.com https://*.instagram.com https://www.instagram.com; connect-src 'self' https://pusaka.smpn8ciamis.sch.id https://www.pusaka.smpn8ciamis.sch.id https://api-pusaka.smpn8ciamis.sch.id wss://api-pusaka.smpn8ciamis.sch.id https://*.hcaptcha.com https://hcaptcha.com https://challenges.cloudflare.com https://www.google.com https://www.recaptcha.net https://*.instagram.com https://www.instagram.com https://graph.facebook.com https://static.cloudflareinsights.com https://i.instagram.com; worker-src 'self' blob:;" always;

    # ------------------------------------------------------------------
    # Proxy WhatsApp API
    # ------------------------------------------------------------------
    location /wa-api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------------------------------------------
    # Route berita
    # Pengunjung biasa: SPA (index.html).
    # Crawler pratinjau (WhatsApp dll.): diteruskan ke bot -> GET /og/berita/<slug>,
    # yang membaca berita terbit langsung dari database (judul, ringkasan, gambar cover),
    # jadi berita baru langsung punya pratinjau tanpa menunggu build/deploy.
    # ------------------------------------------------------------------
    # PENTING: blok .html harus di ATAS blok berita di bawahnya (nginx memakai regex pertama yang cocok).
    # Berkas hasil build lama (scripts/generate-og-pages.cjs) tetap dilayani bila diminta langsung.
    location ~ ^/website/berita/([^/]+)\.html$ {
        try_files $uri =404;
        add_header Content-Type text/html;
    }

    location ~ ^/website/berita/([^/]+)$ {
        error_page 418 = @og_berita;
        if ($og_crawler) { return 418; }
        try_files $uri /index.html;
    }

    location @og_berita {
        rewrite ^/website/berita/(.+)$ /og/berita/$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # ------------------------------------------------------------------
    # File statis — JANGAN fallback ke index.html
    # ------------------------------------------------------------------
    location ~* \.(js|mjs|css|map|json|woff|woff2|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # SPA fallback — HANYA untuk route HTML
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }
}

# ====================================================
# SERVER FRONTEND SMPN 8 CIAMIS (domain utama)
# ====================================================
server {
    listen 443 ssl http2;
    server_name smpn8ciamis.sch.id www.smpn8ciamis.sch.id;

    root /srv/app/app/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/smpn8ciamis.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smpn8ciamis.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Route berita: crawler pratinjau -> bot (sama seperti di server pusaka)
    location ~ ^/website/berita/([^/]+)$ {
        error_page 418 = @og_berita;
        if ($og_crawler) { return 418; }
        try_files $uri /index.html;
    }

    location @og_berita {
        rewrite ^/website/berita/(.+)$ /og/berita/$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # File statis
    location ~* \.(js|mjs|css|map|json|woff|woff2|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }
}

# ====================================================
# MESIN ABSENSI FINGERPRINT (ADMS) — absen.smpn8ciamis.sch.id
# - DNS di Cloudflare: record A "absen" -> IP server, awan ABU-ABU (DNS only)
# - Mesin hanya bisa HTTP biasa di port 80 (tidak bisa HTTPS, tidak mengikuti
#   redirect), jadi blok ini TIDAK boleh mengalihkan ke HTTPS.
# - default_server: bila nama host tidak cocok dengan blok lain, tetap sampai
#   ke bot (mesin yang memakai IP server juga tetap terlayani).
# ====================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name absen.smpn8ciamis.sch.id;

    location /iclock/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}

# ====================================================
# REDIRECT HTTP → HTTPS (website & API)
# ====================================================
server {
    listen 80;
    listen [::]:80;
    server_name pusaka.smpn8ciamis.sch.id www.pusaka.smpn8ciamis.sch.id
                api-pusaka.smpn8ciamis.sch.id
                smpn8ciamis.sch.id www.smpn8ciamis.sch.id;
    return 301 https://$host$request_uri;
}