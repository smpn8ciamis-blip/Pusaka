# Pratinjau tautan berita di WhatsApp / Telegram / Facebook.
#
# Kenapa perlu: situs ini SPA, jadi tag OG (gambar, judul) baru dibuat lewat JavaScript. Crawler WhatsApp
# tidak menjalankan JavaScript, sehingga hanya melihat index.html bawaan. Konfigurasi di bawah mengarahkan
# HANYA permintaan dari crawler untuk /website/berita/<slug> ke endpoint bot (server.js: GET /og/berita/:slug)
# yang mengembalikan tag OG dari berita tersebut. Pengunjung biasa tidak terpengaruh.
#
# Pasang di server (sekali saja):
# 1) Tempel BAGIAN A di paling atas berkas konfigurasi situs (di luar blok server { }),
#    mis. /etc/nginx/sites-available/<nama-situs>, dekat baris limit_req_zone.
# 2) Tempel BAGIAN B di dalam blok server { } situs utama (pusaka.smpn8ciamis.sch.id), sebelum "location / {".
# 3) sudo nginx -t && sudo systemctl reload nginx
#
# Catatan BAGIAN B: memakai lokasi /wa-api/ yang sudah ada (mengarah ke bot). Jika di server Anda bot
# diakses lewat awalan lain, ganti "/wa-api/og/berita/" sesuai awalan itu. Alternatif bila tidak ada awalan:
#   proxy_pass http://127.0.0.1:3000/og/berita/$1;   (ganti 3000 sesuai PORT bot)

# ---------- BAGIAN A ----------
map $http_user_agent $og_crawler {
    default 0;
    ~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview) 1;
}

# ---------- BAGIAN B ----------
location ~ ^/website/berita/([^/]+)$ {
    if ($og_crawler) {
        rewrite ^/website/berita/(.+)$ /wa-api/og/berita/$1 last;
    }
    try_files $uri /index.html;
}
